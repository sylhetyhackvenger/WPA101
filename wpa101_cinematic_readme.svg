<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">WPA101 — Cinematic Wi-Fi Security Simulation</title>
  <desc id="desc">Animated fictional cybersecurity console for authorized Wi-Fi security testing. Visual-only demo, no real scanning or cracking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030711"/><stop offset=".48" stop-color="#07182c"/><stop offset="1" stop-color="#120816"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset=".22" stop-color="#8eeaff"/><stop offset=".48" stop-color="#e8f5ff"/><stop offset=".72" stop-color="#567c9d"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#092b43" stop-opacity=".96"/><stop offset="1" stop-color="#080e20" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/><stop offset=".65" stop-color="#2689ff"/><stop offset="1" stop-color="#53ffb0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1a6d9a" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <clipPath id="screenClip"><rect x="34" y="145" width="1132" height="540" rx="20"/></clipPath>
    <style>
      .mono{font-family:Consolas,'Courier New',monospace}
      .ui{font-family:Arial,Helvetica,sans-serif}
      .cyan{fill:#7beaff}.dim{fill:#6b9ab4}.white{fill:#e9f7ff}
      .tiny{font-size:12px;letter-spacing:1px}.small{font-size:14px}.mid{font-size:18px}
      .line{stroke:#1d7199;stroke-opacity:.55;fill:none}
      .pulse{animation:pulse 2.8s ease-in-out infinite}
      .scan{animation:scan 4.8s linear infinite}
      .blink{animation:blink 1.2s steps(2,end) infinite}
      .dash{stroke-dasharray:8 12;animation:dash 12s linear infinite}
      .wave1{animation:wave 2.4s ease-out infinite;transform-origin:600px 245px}
      .wave2{animation:wave 2.4s ease-out .8s infinite;transform-origin:600px 245px}
      .wave3{animation:wave 2.4s ease-out 1.6s infinite;transform-origin:600px 245px}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      @keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(440px)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.18}}
      @keyframes dash{to{stroke-dashoffset:-400}}
      @keyframes wave{0%{transform:scale(.5);opacity:.8}100%{transform:scale(1.8);opacity:0}}
      @media (prefers-reduced-motion:reduce){.pulse,.scan,.blink,.dash,.wave1,.wave2,.wave3{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="600" cy="250" r="240" fill="#006cff" opacity=".13" filter="url(#soft)"/>
  <circle cx="1060" cy="600" r="180" fill="#ff164f" opacity=".09" filter="url(#soft)"/>
  <rect width="1200" height="760" fill="url(#grid)"/>

  <!-- Header -->
  <path d="M34 38H1166" stroke="#2b91bd" stroke-opacity=".6"/>
  <text x="44" y="31" class="mono tiny cyan">SYLHETYHACKVENGER // CYBER LAB</text>
  <text x="1156" y="31" text-anchor="end" class="mono tiny dim">SIMULATION BUILD 01.01</text>
  <text x="600" y="91" text-anchor="middle" class="ui" font-size="56" font-weight="900" letter-spacing="5" fill="url(#chrome)" filter="url(#glow)">WPA101</text>
  <text x="600" y="120" text-anchor="middle" class="mono small cyan" letter-spacing="4">WI-FI SECURITY CONSOLE</text>
  <path d="M280 134H920" stroke="#00d9ff" stroke-width="1.5" opacity=".75"/>
  <path d="M340 134H860" stroke="#00d9ff" stroke-width="5" opacity=".18" filter="url(#glow)"/>

  <!-- Main frame -->
  <rect x="24" y="145" width="1152" height="540" rx="22" fill="#020711" stroke="#1c9bc8" stroke-width="2"/>
  <rect x="30" y="151" width="1140" height="528" rx="18" fill="url(#panel)" stroke="#1b557b"/>
  <g clip-path="url(#screenClip)">
    <rect x="34" y="145" width="1132" height="540" fill="url(#grid)"/>
    <path d="M34 230H1166M34 460H1166M34 610H1166" class="line"/>
    <path d="M400 145V685M800 145V685" class="line" opacity=".5"/>
    <rect x="34" y="151" width="1132" height="2" fill="#00d9ff" filter="url(#glow)"/>
    <rect x="34" y="151" width="1132" height="440" fill="#00d9ff" opacity=".035" class="scan"/>
  </g>

  <!-- Left telemetry panel -->
  <rect x="54" y="174" width="286" height="270" rx="12" fill="#04111f" stroke="#1b7ba6"/>
  <text x="74" y="201" class="mono tiny cyan">01 / RADIO ENVIRONMENT</text>
  <text x="74" y="232" class="ui mid white" font-weight="700">Nearby signal map</text>
  <g class="mono small">
    <text x="74" y="264" fill="#a7d8ea">LAB-GUEST</text><text x="318" y="264" text-anchor="end" fill="#56ffb2">-42 dBm</text>
    <text x="74" y="296" fill="#a7d8ea">TEST-AP-02</text><text x="318" y="296" text-anchor="end" fill="#7beaff">-58 dBm</text>
    <text x="74" y="328" fill="#a7d8ea">DEMO-NET</text><text x="318" y="328" text-anchor="end" fill="#ffc36a">-71 dBm</text>
  </g>
  <g stroke-width="4" stroke-linecap="round">
    <path d="M74 279H124" stroke="#56ffb2"/><path d="M74 311H104" stroke="#7beaff"/><path d="M74 343H87" stroke="#ffc36a"/>
  </g>
  <text x="74" y="382" class="mono tiny dim">CHANNEL ACTIVITY</text>
  <g fill="#00d9ff" opacity=".8">
    <rect x="75" y="405" width="12" height="18"/><rect x="94" y="393" width="12" height="30"/><rect x="113" y="399" width="12" height="24"/><rect x="132" y="379" width="12" height="44"/><rect x="151" y="387" width="12" height="36"/><rect x="170" y="368" width="12" height="55"/><rect x="189" y="398" width="12" height="25"/><rect x="208" y="382" width="12" height="41"/><rect x="227" y="391" width="12" height="32"/><rect x="246" y="374" width="12" height="49"/><rect x="265" y="402" width="12" height="21"/><rect x="284" y="386" width="12" height="37"/>
  </g>

  <!-- Center Wi-Fi radar -->
  <g fill="none" stroke="#00d9ff" filter="url(#glow)">
    <circle cx="600" cy="300" r="112" stroke-opacity=".22"/>
    <circle cx="600" cy="300" r="82" stroke-opacity=".36" stroke-dasharray="4 8"/>
    <circle cx="600" cy="300" r="50" stroke-opacity=".52"/>
    <circle cx="600" cy="300" r="26" stroke-opacity=".8"/>
    <circle class="wave1" cx="600" cy="245" r="38" stroke-width="2"/>
    <circle class="wave2" cx="600" cy="245" r="38" stroke-width="2"/>
    <circle class="wave3" cx="600" cy="245" r="38" stroke-width="2"/>
    <path d="M535 244Q600 185 665 244M550 260Q600 215 650 260M568 277Q600 249 632 277" stroke-width="8" stroke-linecap="round"/>
  </g>
  <circle cx="600" cy="300" r="5" fill="#f7fdff" filter="url(#glow)"/>
  <path d="M600 300L687 245" stroke="#ff3d6e" stroke-width="2" class="dash"/>
  <circle cx="687" cy="245" r="5" fill="#ff3d6e" class="pulse"/>
  <text x="600" y="372" text-anchor="middle" class="mono tiny cyan">PASSIVE SIGNAL VISUALIZATION</text>
  <text x="600" y="397" text-anchor="middle" class="ui small white">Authorized lab environment</text>

  <!-- Right process panel -->
  <rect x="860" y="174" width="286" height="270" rx="12" fill="#04111f" stroke="#1b7ba6"/>
  <text x="880" y="201" class="mono tiny cyan">02 / WORKFLOW MONITOR</text>
  <g class="ui small">
    <circle cx="891" cy="237" r="7" fill="#56ffb2"/><text x="910" y="242" fill="#d8f4ff">Environment check</text><text x="1124" y="242" text-anchor="end" fill="#56ffb2">READY</text>
    <circle cx="891" cy="276" r="7" fill="#56ffb2"/><text x="910" y="281" fill="#d8f4ff">Signal visualization</text><text x="1124" y="281" text-anchor="end" fill="#56ffb2">LIVE</text>
    <circle cx="891" cy="315" r="7" fill="#7beaff"/><text x="910" y="320" fill="#d8f4ff">Handshake analysis</text><text x="1124" y="320" text-anchor="end" fill="#7beaff">DEMO</text>
    <circle cx="891" cy="354" r="7" fill="#ffbf66"/><text x="910" y="359" fill="#d8f4ff">Credential testing</text><text x="1124" y="359" text-anchor="end" fill="#ffbf66">SIMULATED</text>
  </g>
  <rect x="880" y="388" width="246" height="32" rx="5" fill="#06251f" stroke="#28e9a1"/>
  <text x="1003" y="409" text-anchor="middle" class="mono small" fill="#56ffb2">NO LIVE ATTACK RUNNING</text>

  <!-- Terminal -->
  <rect x="54" y="466" width="1092" height="142" rx="12" fill="#020810" stroke="#23688a"/>
  <rect x="54" y="466" width="1092" height="31" rx="12" fill="#0b2639"/>
  <circle cx="74" cy="481" r="5" fill="#ff5c76"/><circle cx="91" cy="481" r="5" fill="#ffc36a"/><circle cx="108" cy="481" r="5" fill="#56ffb2"/>
  <text x="132" y="486" class="mono tiny cyan">WPA101 :: SIMULATION TERMINAL</text>
  <g class="mono small">
    <text x="76" y="525" fill="#56ffb2">$</text><text x="96" y="525" fill="#d4eaf5">wpa101 --demo --authorized-lab</text>
    <text x="76" y="550" fill="#7beaff">[SIM]</text><text x="132" y="550" fill="#d4eaf5">Loading fictional access-point telemetry...</text>
    <text x="76" y="575" fill="#7beaff">[SIM]</text><text x="132" y="575" fill="#d4eaf5">Rendering signal map and workflow events...</text>
    <text x="76" y="596" fill="#56ffb2">[OK]</text><text x="132" y="596" fill="#d4eaf5">Demo complete — no network was contacted.</text>
  </g>
  <rect x="1097" y="580" width="13" height="20" fill="#7beaff" class="blink"/>

  <!-- Bottom progress and legal -->
  <text x="58" y="641" class="mono tiny cyan">VISUAL DEMO SEQUENCE</text>
  <rect x="58" y="654" width="1084" height="8" rx="4" fill="#0b2b40" stroke="#1a658a"/>
  <rect x="58" y="654" width="1084" height="8" rx="4" fill="url(#progress)" opacity=".9">
    <animate attributeName="width" values="120;1084;620;1084" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="709" text-anchor="middle" class="ui small white" font-weight="700" letter-spacing="2">SYLHETYHACKVENGER <tspan fill="#ff4b70">(THE-ERROR808)</tspan></text>
  <text x="600" y="733" text-anchor="middle" class="mono tiny dim">GRAY HAT CYBERSECURITY • VISUAL-ONLY SIMULATION • TEST ONLY WITH EXPLICIT AUTHORIZATION</text>
  <path d="M24 171H15V659H24M1176 171H1185V659H1176" stroke="#00d9ff" stroke-width="2" fill="none" opacity=".7"/>
</svg>