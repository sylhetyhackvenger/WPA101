<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">WPA101 High Resolution Cyber Operations Console</title>
<desc id="desc">A high-resolution 16:9 cinematic game-like cybersecurity operations dashboard with large readable typography, crisp telemetry panels, network topology, spectrum bars, event log, and restrained continuous animation.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05080d"/><stop offset=".52" stop-color="#0b121b"/><stop offset="1" stop-color="#080b12"/></linearGradient>
  <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#182431"/><stop offset="1" stop-color="#0c141e"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset=".38" stop-color="#d8e6ef"/><stop offset=".7" stop-color="#8097a8"/><stop offset="1" stop-color="#e9f3fa"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00a8cb"/><stop offset=".52" stop-color="#4ce9ff"/><stop offset="1" stop-color="#168db8"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9f1935"/><stop offset=".5" stop-color="#ff4265"/><stop offset="1" stop-color="#b71e40"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#111c27"/><stop offset="1" stop-color="#080e15"/></linearGradient>
  <radialGradient id="ambient"><stop stop-color="#087fa5" stop-opacity=".22"/><stop offset="1" stop-color="#07101a" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#7193a8" stroke-opacity=".06"/></pattern>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .ui{font-family:Inter,'Segoe UI',Arial,sans-serif}
    .white{fill:#edf5fa}.soft{fill:#b3c3cf}.muted{fill:#8b9eac}.cyan{fill:#4ce5fb}.green{fill:#68e6a8}.amber{fill:#ffd078}.redtxt{fill:#ff617c}
    .label{font-size:18px;letter-spacing:2px}.body{font-size:22px}.small{font-size:19px}.large{font-size:28px}
    .panel{fill:url(#panel);stroke:#2b4050;stroke-width:2}.rule{stroke:#304451;stroke-width:1.5}
    .trace{fill:none;stroke:#31d9f5;stroke-width:2;stroke-dasharray:8 12;animation:trace 8s linear infinite}
    .live{animation:live 1.8s ease-in-out infinite}.live2{animation:live 2.4s ease-in-out .7s infinite}
    .sweep{animation:sweep 8s linear infinite}.barflow{transform-box:fill-box;transform-origin:left center;animation:barflow 8s ease-in-out infinite}
    .cursor{animation:cursor 1s steps(2,end) infinite}.orbit{transform-origin:1110px 390px;animation:orbit 24s linear infinite}
    @keyframes live{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes sweep{0%{transform:translateY(0);opacity:0}8%{opacity:.32}92%{opacity:.2}100%{transform:translateY(720px);opacity:0}}
    @keyframes trace{to{stroke-dashoffset:-320}}
    @keyframes barflow{0%{transform:scaleX(.4)}38%{transform:scaleX(.88)}68%{transform:scaleX(.63)}100%{transform:scaleX(.96)}}
    @keyframes cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.trace,.live,.live2,.sweep,.barflow,.cursor,.orbit{animation:none}}
  </style>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" fill="url(#grid)"/>
<ellipse cx="1120" cy="400" rx="570" ry="450" fill="url(#ambient)"/>
<rect x="24" y="24" width="1872" height="1032" rx="18" fill="#05090f" stroke="#40515e" stroke-width="2"/>
<path d="M42 24H1878A18 18 0 0 1 1896 42V92H24V42A18 18 0 0 1 42 24Z" fill="url(#top)"/>
<circle cx="58" cy="58" r="7" fill="#ff5e6d"/><circle cx="82" cy="58" r="7" fill="#e6b65d"/><circle cx="106" cy="58" r="7" fill="#52d996"/>
<text x="138" y="67" class="ui body soft">WPA101</text><text x="250" y="67" class="mono body muted">/</text><text x="274" y="67" class="ui small muted">WIRELESS SECURITY OPERATIONS</text>
<text x="1860" y="66" text-anchor="end" class="mono small muted">SECURE WORKSPACE  /  BUILD 0101</text>
<path d="M24 92H1896" stroke="#40515e" stroke-width="2"/>

<!-- Brand -->
<text x="70" y="143" class="mono label cyan">SYLHETYHACKVENGER  /  THE-ERROR808</text>
<text x="70" y="205" class="ui" font-size="56" font-weight="800" fill="url(#steel)" letter-spacing="1">WPA101 <tspan fill="#8195a4" font-weight="400">/</tspan> CYBER OPERATIONS CONSOLE</text>
<text x="70" y="246" class="ui body soft">Wireless security testing interface</text>
<circle cx="1648" cy="145" r="7" fill="#68e6a8" class="live" filter="url(#glow)"/><text x="1670" y="153" class="mono body green">SYSTEM ONLINE</text>
<text x="1860" y="193" text-anchor="end" class="mono small muted">LOCAL WORKSPACE  ·  AUTHORIZED TESTING</text>
