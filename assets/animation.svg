  <rect x="1207" y="686" width="8" height="18" fill="#7beaff" class="flicker"/>
  <text x="640" y="750" text-anchor="middle" class="ui small white" font-weight="700" letter-spacing="2">SYLHETYHACKVENGER <tspan fill="#ff4b78">(THE-ERROR808)</tspan></text>
  <text x="640" y="769" text-anchor="middle" class="mono tiny muted">GRAY HAT CYBERSECURITY • CINEMATIC UI • FICTIONAL VISUAL DEMONSTRATION</text>

  <!-- continuous sweeping light -->
  <g class="scan" opacity=".65">
    <rect x="34" y="160" width="1212" height="2" fill="#83f4ff" filter="url(#glow)"/>
    <rect x="34" y="160" width="1212" height="18" fill="#00cfff" opacity=".08"/>
