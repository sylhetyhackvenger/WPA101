<text x="54" y="158" class="ui" font-size="31" font-weight="750" fill="url(#steel)" letter-spacing="1.2">WPA101 <tspan fill="#7d91a0" font-weight="400">/</tspan> WIRELESS SECURITY CONSOLE</text>
<text x="1384" y="122" text-anchor="end" class="mono label muted">SYSTEM STATUS</text>
