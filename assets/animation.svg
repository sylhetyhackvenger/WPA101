  <path d="M50 623H1230V722H50Z" fill="#020711" stroke="#1b7198"/>
  <rect x="50" y="623" width="1180" height="28" fill="#0a263a"/>
  <circle cx="69" cy="637" r="4" fill="#ff5977"/><circle cx="83" cy="637" r="4" fill="#ffc36a"/><circle cx="97" cy="637" r="4" fill="#56ffb5"/>
  <text x="116" y="642" class="mono tiny cyan">WPA101 :: SIMULATION TERMINAL</text>
