<circle cx="51" cy="51" r="5" fill="#f05b67"/><circle cx="69" cy="51" r="5" fill="#d8a953"/><circle cx="87" cy="51" r="5" fill="#47c98c"/>
<text x="111" y="55" class="ui small soft">WPA101</text>
