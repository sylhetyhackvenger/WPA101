 <circle cx="900" cy="450" r="15" fill="#111f2a" stroke="#3b8da5" stroke-width="2"/><circle cx="900" cy="450" r="4" fill="#68e6a8" class="live"/>
 <circle cx="900" cy="716" r="15" fill="#111f2a" stroke="#3b8da5" stroke-width="2"/><circle cx="900" cy="716" r="4" fill="#4ce5fb" class="live2"/>
