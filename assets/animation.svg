<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">WPA101 — Cinematic Cybersecurity Simulation</title>
<desc id="desc">An eight-second looping science-fiction cybersecurity dashboard with animated radar, signal waves, telemetry, holographic network map, and a fictional terminal. Visual-only simulation.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#02050d"/><stop offset=".45" stop-color="#07162b"/><stop offset="1" stop-color="#150719"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#9ceeff"/><stop offset=".5" stop-color="#eaf8ff"/><stop offset=".75" stop-color="#547a9b"/><stop offset="1" stop-color="#f7fdff"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00e5ff"/><stop offset=".52" stop-color="#357cff"/><stop offset="1" stop-color="#ff286f"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b3450" stop-opacity=".94"/><stop offset="1" stop-color="#040a17" stop-opacity=".97"/>
  </linearGradient>
  <radialGradient id="core">
    <stop offset="0" stop-color="#8cf6ff" stop-opacity=".9"/><stop offset=".35" stop-color="#006dff" stop-opacity=".35"/><stop offset="1" stop-color="#001a38" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1e80b4" stroke-opacity=".17" stroke-width="1"/>
  </pattern>
  <pattern id="micro" width="8" height="8" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r=".8" fill="#64dcff" opacity=".35"/>
  </pattern>
  <clipPath id="frameClip"><rect x="24" y="24" width="1232" height="752" rx="28"/></clipPath>
  <style>
    .mono{font-family:Consolas,'Courier New',monospace}
    .ui{font-family:Arial,Helvetica,sans-serif}
    .cyan{fill:#8beeff}.muted{fill:#6a9bb7}.white{fill:#eefaff}
    .tiny{font-size:12px;letter-spacing:1.5px}.small{font-size:15px}.med{font-size:18px}
    .edge{fill:none;stroke:#21bfff;stroke-opacity:.62}
    .glow{filter:url(#glow)}
    .rotate{transform-origin:640px 367px;animation:rotate 18s linear infinite}
    .rotateBack{transform-origin:640px 367px;animation:rotateBack 24s linear infinite}
    .scan{animation:scan 8s linear infinite}
    .pulse{animation:pulse 2s ease-in-out infinite}
    .pulse2{animation:pulse 2.8s ease-in-out .6s infinite}
    .dash{stroke-dasharray:10 13;animation:dash 8s linear infinite}
    .nodePulse{animation:nodePulse 1.8s ease-in-out infinite}
    .flicker{animation:flicker 4s steps(2,end) infinite}
    .meter{transform-box:fill-box;transform-origin:left center;animation:meter 8s ease-in-out infinite}
    .wave{transform-origin:640px 310px;animation:wave 2.4s ease-out infinite}
    .wave2{transform-origin:640px 310px;animation:wave 2.4s ease-out .8s infinite}
    .wave3{transform-origin:640px 310px;animation:wave 2.4s ease-out 1.6s infinite}
    @keyframes rotate{to{transform:rotate(360deg)}}
    @keyframes rotateBack{to{transform:rotate(-360deg)}}
    @keyframes scan{0%{transform:translateY(0);opacity:0}8%{opacity:.5}92%{opacity:.35}100%{transform:translateY(690px);opacity:0}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes dash{to{stroke-dashoffset:-368}}
    @keyframes nodePulse{0%,100%{r:3;opacity:.5}50%{r:6;opacity:1}}
    @keyframes flicker{0%,92%,100%{opacity:1}94%{opacity:.55}96%{opacity:.9}}
    @keyframes meter{0%{transform:scaleX(.2)}35%{transform:scaleX(.72)}62%{transform:scaleX(.48)}100%{transform:scaleX(1)}}
    @keyframes wave{0%{transform:scale(.4);opacity:.8}100%{transform:scale(2.2);opacity:0}}
    @media (prefers-reduced-motion:reduce){.rotate,.rotateBack,.scan,.pulse,.pulse2,.dash,.nodePulse,.flicker,.meter,.wave,.wave2,.wave3{animation:none}}
  </style>
</defs>

<rect width="1280" height="800" fill="url(#bg)"/>
<circle cx="640" cy="350" r="300" fill="#006eff" opacity=".16" filter="url(#blur)"/>
<circle cx="1100" cy="640" r="200" fill="#ff145f" opacity=".1" filter="url(#blur)"/>
<rect width="1280" height="800" fill="url(#grid)"/>
<g clip-path="url(#frameClip)">
  <!-- atmospheric beams -->
  <path d="M-80 690L430 80 520 80 60 800Z" fill="#00c8ff" opacity=".035"/>
  <path d="M1350 90L850 800 960 800 1430 130Z" fill="#ff1e6a" opacity=".04"/>
  <rect x="24" y="24" width="1232" height="752" rx="28" fill="none" stroke="#1d94c7" stroke-width="2"/>
  <rect x="30" y="30" width="1220" height="740" rx="24" fill="none" stroke="#4bdaff" stroke-opacity=".22"/>
  <path d="M42 118H1238" stroke="#2aa8d7" stroke-opacity=".7"/>
  <text x="58" y="65" class="mono tiny cyan">SYLHETYHACKVENGER // CYBER OPERATIONS LAB</text>
  <text x="1222" y="65" text-anchor="end" class="mono tiny muted">SIMULATION / BUILD 0101</text>
  <text x="640" y="105" text-anchor="middle" class="ui" font-size="57" font-weight="900" letter-spacing="7" fill="url(#metal)" filter="url(#glow)">WPA101</text>
  <text x="640" y="142" text-anchor="middle" class="mono small cyan" letter-spacing="5">WI-FI SECURITY CONSOLE</text>

  <!-- left telemetry -->
  <path d="M50 168H324L344 188V600H50Z" fill="url(#glass)" stroke="#1f86b3" stroke-width="1.5"/>
  <path d="M50 168H324L344 188" fill="none" stroke="#73ecff" stroke-width="2" filter="url(#glow)"/>
  <text x="72" y="201" class="mono tiny cyan">01 / RADIO TELEMETRY</text>
  <text x="72" y="233" class="ui med white" font-weight="700">Signal environment</text>
  <text x="72" y="263" class="mono tiny muted">DEMO ACCESS POINTS</text>
  <g class="mono small">
    <text x="72" y="296" fill="#d9f5ff">LAB-GUEST</text><text x="316" y="296" text-anchor="end" fill="#56ffb5">-42 dBm</text>
    <text x="72" y="329" fill="#d9f5ff">TEST-AP-02</text><text x="316" y="329" text-anchor="end" fill="#77dfff">-58 dBm</text>
    <text x="72" y="362" fill="#d9f5ff">DEMO-NET</text><text x="316" y="362" text-anchor="end" fill="#ffc36a">-71 dBm</text>
  </g>
  <g stroke-width="4" stroke-linecap="round">
    <path d="M72 308H144" stroke="#56ffb5"/><path d="M72 341H119" stroke="#77dfff"/><path d="M72 374H93" stroke="#ffc36a"/>
  </g>
  <text x="72" y="415" class="mono tiny muted">SPECTRUM / ACTIVITY</text>
  <g fill="#00d9ff" opacity=".82">
    <rect x="73" y="455" width="12" height="43"/><rect x="91" y="438" width="12" height="60"/><rect x="109" y="465" width="12" height="33"/><rect x="127" y="424" width="12" height="74"/><rect x="145" y="448" width="12" height="50"/><rect x="163" y="416" width="12" height="82"/><rect x="181" y="459" width="12" height="39"/><rect x="199" y="435" width="12" height="63"/><rect x="217" y="449" width="12" height="49"/><rect x="235" y="421" width="12" height="77"/><rect x="253" y="462" width="12" height="36"/><rect x="271" y="440" width="12" height="58"/><rect x="289" y="430" width="12" height="68"/>
  </g>
  <path d="M72 518H316" stroke="#1a688e"/>
  <text x="72" y="545" class="mono tiny cyan">CHANNEL 06</text>
  <text x="316" y="545" text-anchor="end" class="mono tiny muted">2.437 GHz / DEMO</text>
  <text x="72" y="576" class="mono tiny muted">SIGNAL HISTORY</text>
  <path d="M72 588L94 579 116 586 138 565 160 575 182 552 204 565 226 547 248 558 270 538 292 547 316 530" fill="none" stroke="#00d9ff" stroke-width="2" class="dash" filter="url(#glow)"/>

  <!-- central holographic core -->
  <circle cx="640" cy="367" r="245" fill="url(#core)"/>
  <g class="rotateBack" fill="none" stroke="#00d9ff">
    <circle cx="640" cy="367" r="218" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="2 9"/>
    <circle cx="640" cy="367" r="193" stroke-opacity=".42" stroke-width="2" stroke-dasharray="32 12 3 12"/>
    <path d="M640 132V157M640 577V602M405 367H430M850 367H875M474 201L492 219M788 515L806 533M474 533L492 515M788 219L806 201" stroke-width="4"/>
  </g>
  <g class="rotate" fill="none" stroke="#ff3978">
    <circle cx="640" cy="367" r="174" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="42 18"/>
    <path d="M640 175L660 195 640 215 620 195Z M812 367L792 387 772 367 792 347Z M640 559L620 539 640 519 660 539Z M468 367L488 347 508 367 488 387Z" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#00d9ff" filter="url(#glow)">
    <circle cx="640" cy="367" r="112" stroke-opacity=".2"/>
    <circle cx="640" cy="367" r="82" stroke-opacity=".35" stroke-dasharray="4 8"/>
    <circle cx="640" cy="367" r="50" stroke-opacity=".55"/>
    <circle cx="640" cy="310" r="42" class="wave" stroke-width="2"/>
    <circle cx="640" cy="310" r="42" class="wave2" stroke-width="2"/>
    <circle cx="640" cy="310" r="42" class="wave3" stroke-width="2"/>
    <path d="M578 309Q640 252 702 309M593 328Q640 286 687 328M610 346Q640 319 670 346" stroke-width="8" stroke-linecap="round"/>
  </g>
  <circle cx="640" cy="367" r="6" fill="#f6ffff" filter="url(#glow)"/>
  <path d="M640 367L742 291" stroke="#ff3978" stroke-width="2" class="dash"/>
  <circle cx="742" cy="291" r="6" fill="#ff3978" class="pulse"/>
  <text x="640" y="435" text-anchor="middle" class="mono tiny cyan">HOLOGRAPHIC SIGNAL ANALYSIS</text>
  <text x="640" y="461" text-anchor="middle" class="ui small white">Authorized lab • visual simulation</text>

  <!-- floating packet glyphs -->
  <g class="mono tiny glow">
    <text x="402" y="256" fill="#65eaff">0x7A</text><text x="785" y="238" fill="#ff6b9b">PKT_04</text>
    <text x="407" y="493" fill="#65eaff">RX / 2.4G</text><text x="792" y="490" fill="#65eaff">SYNC_OK</text>
    <text x="545" y="190" fill="#86f4ff">SIGNAL LOCK</text><text x="546" y="548" fill="#ff77a8">LAB MODE</text>
  </g>
  <g fill="#7beaff">
    <circle cx="415" cy="284" r="3" class="nodePulse"/><circle cx="825" cy="282" r="3" class="nodePulse"/>
    <circle cx="435" cy="462" r="3" class="nodePulse"/><circle cx="810" cy="460" r="3" class="nodePulse"/>
  </g>

  <!-- right process panel -->
  <path d="M936 188L956 168H1230V600H936Z" fill="url(#glass)" stroke="#1f86b3" stroke-width="1.5"/>
  <path d="M956 168H1230" stroke="#73ecff" stroke-width="2" filter="url(#glow)"/>
  <text x="964" y="201" class="mono tiny cyan">02 / WORKFLOW MONITOR</text>
  <text x="964" y="233" class="ui med white" font-weight="700">Operation timeline</text>
  <g class="ui small">
    <circle cx="974" cy="272" r="6" fill="#56ffb5" class="pulse"/><text x="992" y="277" fill="#d9f5ff">Environment check</text><text x="1210" y="277" text-anchor="end" fill="#56ffb5">READY</text>
    <circle cx="974" cy="315" r="6" fill="#56ffb5" class="pulse2"/><text x="992" y="320" fill="#d9f5ff">Signal visualization</text><text x="1210" y="320" text-anchor="end" fill="#56ffb5">LIVE</text>
    <circle cx="974" cy="358" r="6" fill="#7beaff" class="pulse"/><text x="992" y="363" fill="#d9f5ff">Handshake analysis</text><text x="1210" y="363" text-anchor="end" fill="#7beaff">DEMO</text>
    <circle cx="974" cy="401" r="6" fill="#ffc36a" class="pulse2"/><text x="992" y="406" fill="#d9f5ff">Credential testing</text><text x="1210" y="406" text-anchor="end" fill="#ffc36a">SIMULATED</text>
  </g>
  <text x="964" y="452" class="mono tiny muted">SYSTEM LOAD</text>
  <rect x="964" y="466" width="246" height="9" rx="4" fill="#0b2c43"/>
  <rect x="964" y="466" width="246" height="9" rx="4" fill="url(#neon)" class="meter"/>
  <text x="964" y="506" class="mono tiny muted">EVENT STREAM</text>
  <g class="mono tiny">
    <text x="964" y="531" fill="#72eaff">21:08:04</text><text x="1050" y="531" fill="#d7f3ff">RADAR_SYNC</text>
    <text x="964" y="553" fill="#72eaff">21:08:05</text><text x="1050" y="553" fill="#d7f3ff">SIGNAL_LOCK</text>
    <text x="964" y="575" fill="#72eaff">21:08:06</text><text x="1050" y="575" fill="#56ffb5">DEMO_EVENT</text>
