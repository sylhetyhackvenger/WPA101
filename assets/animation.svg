<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">WPA101 Cyber Operations Interface</title>
<desc id="desc">A restrained, high-end dark cyber operations dashboard with realistic terminal typography, live-style telemetry, a scanning spectrum, network topology, and animated status lights.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05080d"/><stop offset=".5" stop-color="#0a1018"/><stop offset="1" stop-color="#070b12"/>
  </linearGradient>
  <linearGradient id="topbar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#151e29"/><stop offset="1" stop-color="#0c131c"/>
  </linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f2f7fa"/><stop offset=".22" stop-color="#8398a8"/><stop offset=".48" stop-color="#e6edf2"/><stop offset=".7" stop-color="#596d7d"/><stop offset="1" stop-color="#dbe5ec"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00b8d9"/><stop offset=".5" stop-color="#2ce5ff"/><stop offset="1" stop-color="#1496c7"/>
  </linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a71836"/><stop offset=".5" stop-color="#ff355d"/><stop offset="1" stop-color="#b91f3f"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#101923"/><stop offset="1" stop-color="#080e15"/>
  </linearGradient>
  <radialGradient id="ambient">
    <stop offset="0" stop-color="#087ea5" stop-opacity=".22"/><stop offset="1" stop-color="#07101a" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/><feOffset dy="8"/><feComponentTransfer><feFuncA type="linear" slope=".6"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="finegrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#6c8797" stroke-opacity=".055"/>
  </pattern>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .ui{font-family:Inter,Segoe UI,Arial,sans-serif}
    .muted{fill:#718493}.soft{fill:#aab9c5}.bright{fill:#e8f0f5}.cyan{fill:#39d9f4}.green{fill:#59e0a0}.redtxt{fill:#ff5a74}.amber{fill:#efbf6b}
    .label{font-size:11px;letter-spacing:1.6px}.body{font-size:13px}.small{font-size:12px}
    .panel{fill:url(#panel);stroke:#263744;stroke-width:1}
    .rule{stroke:#263b49;stroke-width:1}
    .trace{fill:none;stroke:#26c7e8;stroke-opacity:.65;stroke-width:1.4;stroke-dasharray:5 8;animation:trace 8s linear infinite}
    .live{animation:live 1.7s ease-in-out infinite}
    .live2{animation:live 2.5s ease-in-out .6s infinite}
    .sweep{animation:sweep 8s linear infinite}
    .barflow{animation:barflow 8s ease-in-out infinite}
    .cursor{animation:cursor 1s steps(2,end) infinite}
    .orbit{transform-origin:1047px 382px;animation:orbit 22s linear infinite}
    .orbit2{transform-origin:1047px 382px;animation:orbit2 30s linear infinite}
    @keyframes live{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes sweep{0%{transform:translateY(0);opacity:0}8%{opacity:.35}90%{opacity:.22}100%{transform:translateY(600px);opacity:0}}
    @keyframes trace{to{stroke-dashoffset:-208}}
    @keyframes barflow{0%{transform:scaleX(.22)}35%{transform:scaleX(.82)}62%{transform:scaleX(.58)}100%{transform:scaleX(.95)}}
    @keyframes cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes orbit2{to{transform:rotate(-360deg)}}
    @media (prefers-reduced-motion:reduce){.trace,.live,.live2,.sweep,.barflow,.cursor,.orbit,.orbit2{animation:none}}
  </style>
</defs>

<rect width="1440" height="900" fill="url(#bg)"/>
<rect width="1440" height="900" fill="url(#finegrid)"/>
<ellipse cx="1040" cy="380" rx="420" ry="340" fill="url(#ambient)"/>
<path d="M0 0H1440V900H0Z" fill="none" stroke="#3a4a57" stroke-width="16" opacity=".18"/>

<!-- app chrome -->
