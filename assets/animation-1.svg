<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">WPA101 — Cinematic Cybersecurity Console</title>
<desc id="desc">Cinematic dark cyber-operations artwork with subtle animated scan light, radar rings, signal pulses and HUD accents.</desc>
<defs>
  <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#020611" stop-opacity=".10"/>
    <stop offset=".68" stop-color="#020611" stop-opacity=".03"/>
    <stop offset="1" stop-color="#020611" stop-opacity=".38"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00d9ff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#69efff" stop-opacity=".65"/>
    <stop offset="1" stop-color="#00d9ff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="radarGlow">
    <stop offset="0" stop-color="#00d9ff" stop-opacity=".20"/>
    <stop offset="1" stop-color="#00d9ff" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .sweep{animation:sweep 8s linear infinite}
    .orbit{transform-origin:1120px 245px;animation:orbit 16s linear infinite}
    .orbit2{transform-origin:1120px 245px;animation:orbit2 11s linear infinite}
    .pulse{animation:pulse 1.8s ease-in-out infinite}
    .pulse2{animation:pulse 2.4s ease-in-out .7s infinite}
    .dash{stroke-dasharray:5 12;animation:dash 8s linear infinite}
    .glint{animation:glint 8s ease-in-out infinite}
    @keyframes sweep{0%{transform:translateY(-120px);opacity:0}8%{opacity:.5}90%{opacity:.25}100%{transform:translateY(1024px);opacity:0}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes orbit2{to{transform:rotate(-360deg)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes dash{to{stroke-dashoffset:-340}}
    @keyframes glint{0%,12%,100%{opacity:0}18%{opacity:.75}25%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.sweep,.orbit,.orbit2,.pulse,.pulse2,.dash,.glint{animation:none}}
  </style>
</defs>

<!-- Cinematic, image-based artwork keeps the scene photorealistic rather than cartoon-like. -->
<image href="./wpa101_cinematic_background.png" x="0" y="0" width="1536" height="1024" preserveAspectRatio="xMidYMid slice"/>
<rect width="1536" height="1024" fill="url(#shade)"/>

<!-- Fine glass-screen frame -->
<rect x="18" y="18" width="1500" height="988" rx="14" fill="none" stroke="#35cfff" stroke-opacity=".45" stroke-width="1.5"/>
<path d="M18 104V18H104M1432 18H1518V104M18 920V1006H104M1432 1006H1518V920" fill="none" stroke="#6beaff" stroke-width="3" filter="url(#glow)"/>
<path d="M38 122H1498" stroke="#43d8ff" stroke-opacity=".24"/>
<text x="48" y="70" fill="#8cecff" font-family="Consolas,monospace" font-size="14" letter-spacing="3">SYLHETYHACKVENGER / CYBER OPERATIONS</text>
<text x="1488" y="70" text-anchor="end" fill="#b2d7e9" font-family="Consolas,monospace" font-size="13" letter-spacing="2">WPA101 // FIELD CONSOLE</text>

<!-- Subtle radar overlay over the holographic globe -->
<circle cx="1120" cy="245" r="170" fill="url(#radarGlow)"/>
<g class="orbit" fill="none" stroke="#44dfff" filter="url(#glow)">
  <circle cx="1120" cy="245" r="132" stroke-opacity=".55" stroke-width="1.3" stroke-dasharray="4 10"/>
  <circle cx="1120" cy="245" r="158" stroke-opacity=".42" stroke-width="1.2" stroke-dasharray="24 10 3 10"/>
  <path d="M1120 73V95M1120 395V417M948 245H970M1270 245H1292" stroke-width="3"/>
</g>
<g class="orbit2" fill="none" stroke="#ff3d75" filter="url(#glow)">
  <circle cx="1120" cy="245" r="92" stroke-opacity=".55" stroke-dasharray="18 12"/>
  <path d="M1120 130L1132 142 1120 154 1108 142ZM1223 245L1211 257 1199 245 1211 233Z" stroke-width="2"/>
</g>
<circle cx="1120" cy="245" r="5" fill="#fff" class="pulse" filter="url(#glow)"/>
<circle cx="1210" cy="205" r="4" fill="#ff477b" class="pulse2" filter="url(#glow)"/>
<path d="M1120 245L1210 205" stroke="#ff477b" stroke-width="1.5" class="dash"/>

<!-- Animated light passes like a real monitor reflection -->
<g class="sweep">
  <rect x="24" y="0" width="1488" height="3" fill="url(#beam)" filter="url(#glow)"/>
  <rect x="24" y="0" width="1488" height="34" fill="#18cfff" opacity=".035"/>
</g>
<path d="M42 864H1494" stroke="#00cfff" stroke-opacity=".28"/>
<path d="M52 866H760" stroke="#72eaff" stroke-width="2" stroke-opacity=".55" filter="url(#glow)"/>
<path d="M780 866H1485" stroke="#ff356f" stroke-width="1.5" stroke-opacity=".55"/>

<!-- Animated fine data traces, kept deliberately restrained -->
<g fill="none" stroke="#6deaff" stroke-width="1.2" opacity=".7">
  <path d="M50 164H270L286 180H418" class="dash"/>
  <path d="M1115 464H1265L1280 479H1480" class="dash"/>
  <path d="M50 710H180L195 695H320" class="dash"/>
</g>
<g class="pulse" fill="#8ef2ff" filter="url(#glow)">
  <circle cx="286" cy="180" r="3"/><circle cx="1265" cy="464" r="3"/><circle cx="195" cy="695" r="3"/>
</g>
<rect x="34" y="34" width="1468" height="956" fill="none" stroke="#9aefff" stroke-opacity=".12"/>
<path d="M520 152L700 152" stroke="#8defff" stroke-width="1.4" class="glint" filter="url(#glow)"/>

<!-- Small title lockup at the foot; main title remains in the artwork. -->
<text x="768" y="955" text-anchor="middle" fill="#d9f7ff" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="5">WPA101  •  GRAY HAT CYBERSECURITY</text>
<text x="768" y="981" text-anchor="middle" fill="#83dfff" font-family="Consolas,monospace" font-size="12" letter-spacing="4">SYLHETYHACKVENGER (THE-ERROR808)</text>
</svg>